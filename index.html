<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Magno.bp - Merge. Race. Dominate. Fast-paced mobile runner game!">
    <meta name="theme-color" content="#1a0a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>Magno.bp - Merge Runner Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0514 0%, #1a0a2e 100%);
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        #gameCanvas {
            display: block;
            margin: 0 auto;
            background: #0f0520;
            max-width: 100vw;
            max-height: 100vh;
            touch-action: none;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            z-index: 10;
        }
        
        .btn {
            background: rgba(100, 150, 255, 0.8);
            border: 2px solid #fff;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            font-size: 24px;
            color: white;
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        
        .btn:active {
            transform: scale(0.95);
            background: rgba(80, 130, 235, 0.9);
        }
        
        #adOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        #adContent {
            background: #1a1a2e;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            color: white;
            max-width: 90%;
        }
        
        #adContent h2 {
            color: #ffc107;
            margin-bottom: 20px;
        }
        
        #adTimer {
            font-size: 24px;
            color: #4caf50;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div>Level: <span id="level">1</span></div>
        <div>🪙 <span id="tokens">0</span> JVW</div>
        <div>Tier: <span id="tier">Tiny</span></div>
    </div>
    
    <div id="controls">
        <div class="btn" id="leftBtn">◀</div>
        <div class="btn" id="boostBtn">⚡</div>
        <div class="btn" id="rightBtn">▶</div>
    </div>
    
    <div style="position: absolute; top: 10px; right: 10px; z-index: 20;">
        <button id="shopBtn" style="background: #FFD700; border: 3px solid #fff; border-radius: 10px; padding: 10px 20px; font-size: 18px; font-weight: bold; color: #000; cursor: pointer; box-shadow: 0 4px 8px rgba(0,0,0,0.5);">
            🛒 SHOP
        </button>
    </div>
    
    <div id="adOverlay">
        <div id="adContent">
            <h2>📺 ADVERTISEMENT 📺</h2>
            <p>Ad opened in new tab</p>
            <p>Please check your browser</p>
            <div id="adTimer">3</div>
            <p style="color: #aaa;">Continuing automatically...</p>
        </div>
    </div>

    <script src="game.js" defer></script>
    
    <!-- PWA Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => {
                console.log('[PWA] Service Worker registered');
            });
        }
    </script>
</body>
</html>
